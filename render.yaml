# Render 一键部署蓝图（Blueprint）。
# 用法：render.com → New → Blueprint → 选本仓库 → 按提示填 API key → Apply。
# 🔴 必填三项：ANTHROPIC_API_KEY / TAVILY_API_KEY / HEISENBERG_API_KEY。缺 ANTHROPIC_API_KEY
#    则任何未缓存钱包都会 NO_KEY → 502（回落的课堂网关域名已 NXDOMAIN，见下）。
# 🔴 部署分支 = master，**合了 PR 就是上线**。别再新增长期分支当"真相"：
#    v3-briefing 已于 PR #7 合进 master 并退役，它继续存在只会让人误以为线上是它。
# 免费档注意：闲置 15 分钟休眠（冷启动约 1 分钟，demo 前先打开热身）；磁盘 ephemeral，
# 冷启动时由 api/main.py 从 git 跟踪的 seed/ 恢复缓存 → 已缓存钱包零 token 秒回。
services:
  - type: web
    name: smart-money-decoder
    runtime: python
    plan: free
    branch: master             # 唯一真相 = 唯一部署源（见文件头）
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /backtest
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      # 🔴 必填：全部 AI 调用的后端（core/llm.py 首选）。都在 Render 控制台填，绝不入库。
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: HEISENBERG_API_KEY
        sync: false
      # 可选：GitHub 状态持久层（core/persist.py）。fine-grained PAT，仅本仓库 Contents
      # 读写；不填则刷新出的推荐榜/记分牌每次冷启动都退回 seed 快照。
      - key: GITHUB_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false          # 可选：Render Key Value / Upstash 连接串；未配不影响单实例运行
      # 旧课堂网关回落位：默认域名 2026-07-08 起 NXDOMAIN，有 ANTHROPIC_API_KEY 就无需填。
      - key: CLASSROOM_API_KEY
        sync: false
