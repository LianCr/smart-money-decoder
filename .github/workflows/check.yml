# 本地门禁 = CI 门禁：两边跑的是**同一个** scripts/check.sh，不维护第二套清单。
#
# 🔴 刻意不注入任何 API key。这不是疏忽，是把 CLAUDE.md 协作纪律 #1 钉死成机器可验证的事实：
#    测试全部是 mock、不打网络、零 token、任何人 clone 下来立刻能跑。
#    哪天有人写了个"要真 key 才过"的测试，CI 会在这里红掉 —— 那正是我们要的信号。
name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # 与 render.yaml 的 PYTHON_VERSION 对齐
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: frontend

      # 全部测试 + 前端构建校验（和本地 `bash scripts/check.sh` 完全一致）
      - run: bash scripts/check.sh

  # analytics/*.sql must stay portable: the app runs the views on in-process SQLite,
  # this job applies the same schema + views to a real PostgreSQL 16 and runs the same
  # checks (SQL scorecard == Python compute_scorecard). Throwaway service container,
  # no secrets: the password below only exists inside this job.
  sql-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smd
          POSTGRES_PASSWORD: smd
          POSTGRES_DB: smd_analytics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smd -d smd_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://smd:smd@localhost:5432/smd_analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # psycopg is CI-only: production never talks to Postgres, so it stays out of requirements.txt
      - run: pip install -r requirements.txt "psycopg[binary]==3.2.3"
      - run: python tests/test_analytics_sql.py
